<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1320" viewBox="0 0 1920 1320"><rect width="100%" height="100%" fill="white"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#263633} .h{font-size:31px;font-weight:bold} .sh{font-size:25px;font-weight:bold} .t{font-size:23px} .sub{font-size:20px;fill:#52645B} .rule{stroke:#C4D0C9;stroke-width:4;fill:none}</style><text class="h" x="60" y="62">Modèle conceptuel des données — deux parcours, un noyau commun</text><text class="sub" x="60" y="101">Le sujet publié et la proposition étudiante sont unifiés dans ProjetPFA, avec une origine explicitement contrôlée.</text><rect x="60" y="165" rx="16" width="845" height="165" stroke="#8EA59A" stroke-width="3" fill="#F8F2EE"/><text class="sh" x="84" y="207">PARCOURS A — enseignant</text><text class="sub" x="84" y="248">Enseignant → ProjetPFA</text><text class="sub" x="84" y="280">origine = ENSEIGNANT</text><rect x="1015" y="165" rx="16" width="845" height="165" stroke="#8EA59A" stroke-width="3" fill="#EEF5F1"/><text class="sh" x="1039" y="207">PARCOURS B — étudiant</text><text class="sub" x="1039" y="248">Groupe (1..n) → ProjetPFA</text><text class="sub" x="1039" y="280">origine = ETUDIANT</text><path class="rule" d="M480,330 L480,422"/><path d="M470,410 L480,422 L490,410" fill="none" stroke="#9B6452" stroke-width="4"/><path class="rule" d="M1438,330 L1438,422"/><path d="M1428,410 L1438,422 L1448,410" fill="none" stroke="#9B6452" stroke-width="4"/><rect x="410" y="425" rx="16" width="1100" height="160" stroke="#8EA59A" stroke-width="3" fill="#FAFCFA"/><text class="sh" x="434" y="467">PROJET_PFA (1 projet pour 0..n candidatures)</text><text class="sub" x="434" y="508">Identifiant, origine, titre, modalité, campagne</text><path class="rule" d="M960,585 L960,666"/><path d="M950,654 L960,666 L970,654" fill="none" stroke="#9B6452" stroke-width="4"/><rect x="440" y="665" rx="16" width="1040" height="145" stroke="#8EA59A" stroke-width="3" fill="#F8FAF8"/><text class="sh" x="464" y="707">CANDIDATURE</text><text class="sub" x="464" y="748">Groupe candidat + projet + enseignant destinataire + statut</text><path class="rule" d="M960,810 L960,890"/><path d="M950,878 L960,890 L970,878" fill="none" stroke="#9B6452" stroke-width="4"/><rect x="440" y="891" rx="16" width="1040" height="154" stroke="#8EA59A" stroke-width="3" fill="#F8FAF8"/><text class="sh" x="464" y="933">AFFECTATION</text><text class="sub" x="464" y="974">Candidature favorable + enseignant + campagne · validation atomique</text><rect x="50" y="905" rx="16" width="325" height="157" stroke="#8EA59A" stroke-width="3" fill="#F8F2EE"/><text class="sh" x="74" y="947">QUOTA_ENCADREMENT</text><text class="sub" x="74" y="988">1 quota par</text><text class="sub" x="74" y="1020">(campagne, enseignant)</text><rect x="1540" y="905" rx="16" width="325" height="157" stroke="#8EA59A" stroke-width="3" fill="#EEF5F1"/><text class="sh" x="1564" y="947">AFFECTATION_MEMBRE</text><text class="sub" x="1564" y="988">1 ligne par membre</text><text class="sub" x="1564" y="1020">(campagne, étudiant) unique</text><path class="rule" d="M375,982 L440,982"/><path d="M428,972 L440,982 L428,992" fill="none" stroke="#9B6452" stroke-width="4"/><path class="rule" d="M1480,982 L1540,982"/><path d="M1528,972 L1540,982 L1528,992" fill="none" stroke="#9B6452" stroke-width="4"/><rect x="60" y="1134" width="1800" height="145" rx="15" fill="#F5F6F2"/><text class="sh" x="85" y="1181">Invariants métier retenus</text><text class="t" x="85" y="1223">Quota par enseignant et campagne · confirmation de tous les membres · aucune double affectation étudiante.</text><text class="sub" x="85" y="1257">Les relations détaillées et les multiplicités figurent dans le diagramme de classes et la matrice jointe.</text></svg>